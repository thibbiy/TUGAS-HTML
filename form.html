
<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Form Pendaftaran</title>
    </head>
    <body>
        <h2>Form Pendaftaran</h2>
        
        <form action="" method="POST">
            <table>
                <tr>
                    <td><label for="nama">Nama Lengkap</label></td>
                    <td>:</td>
                    <td><input type="text" id="nama" name="nama_lengkap" required /></td>
                </tr>
                <tr>
                    <td><label for="hp">No HP</label></td>
                    <td>:</td>
                    <td><input type="number" id="hp" name="no_hp" required placeholder="Masukkan angka" /></td>
                </tr>
                <tr>
                    <td><label for="password">Password</label></td>
                    <td>:</td>
                    <td><input type="password" id="password" name="password" required /></td>
                </tr>
                <tr>
                    <td><label for="email">Email</label></td>
                    <td>:</td>
                    <td><input type="email" id="email" name="email" required placeholder="Masukkan email" /></td>
                </tr>
                <tr>
                    <td><label for="tgl_lahir">Tanggal Lahir</label></td>
                    <td>:</td>
                    <td><input type="date" id="tgl_lahir" name="tgl_lahir" /></td>
                </tr>
                <tr>
                    <td><label>Jenis Kelamin</label></td>
                    <td>:</td>
                    <td>
                        <input type="radio" id="jk_l" name="jenis_kelamin" value="laki-laki" />
                        <label for="jk_l">Laki-laki</label>
                        <input type="radio" id="jk_p" name="jenis_kelamin" value="perempuan" />
                        <label for="jk_p">Perempuan</label>
                    </td>
                </tr>
                <tr>
                    <td><label>Hobi</label></td>
                    <td>:</td>
                    <td>
                        <input type="checkbox" id="hobi_membaca" name="hobi[]" value="membaca" />
                        <label for="hobi_membaca">Membaca</label>
                        
                        <input type="checkbox" id="hobi_menulis" name="hobi[]" value="menulis" />
                        <label for="hobi_menulis">Menulis</label>
                        
                        <input type="checkbox" id="hobi_olahraga" name="hobi[]" value="olahraga" />
                        <label for="hobi_olahraga">Olahraga</label>
                        
                        <input type="checkbox" id="hobi_tari" name="hobi[]" value="seni tari" />
                        <label for="hobi_tari">Seni Tari</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="alamat">Alamat</label></td>
                    <td>:</td>
                    <td><textarea id="alamat" name="alamat" placeholder="Masukkan alamat"></textarea></td>
                </tr>
                <tr>
                    <td><label for="jurusan">Jurusan</label></td>
                    <td>:</td>
                    <td>
                        <select id="jurusan" name="jurusan">
                            <option value="rpl">RPL</option>
                            <option value="tkj">TKJ</option>
                            <option value="pg">PG</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="foto">Foto</label></td>
                    <td>:</td>
                    <td><input type="file" id="foto" name="foto" /></td>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                    <td><input type="submit" value="submit" /></td>
                </tr>
            </table>
        </form>
    </body>
</html>
